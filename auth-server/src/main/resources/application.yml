
server:
  port: 9081

spring:
  application:
    name: auth-server
  datasource:
    url: jdbc:postgresql://${AUTH_DB_HOST:localhost}:5432/authdb
    username: ${AUTH_DB_USER:auth_user}
    password: ${AUTH_DB_PASS:auth_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: "SET search_path TO auth, public"
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: auth
    create-schemas: true
  session:
    jdbc:
      initialize-schema: never
      # Hourly cleanup of expired Spring Session rows (avoid unbounded growth)
      cleanup-cron: "0 0 * * * *"
    store-type: jdbc
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

iam:
  base-url: ${IAM_BASE_URL:http://localhost:9083}
  internal-token: ${IAM_INTERNAL_TOKEN:dev-internal-token}

auth:
  issuer: ${AUTH_ISSUER:http://localhost:9081}
  login-success-url: ${AUTH_LOGIN_SUCCESS_URL:/login/success}
  signing:
    key-path: ${AUTH_SIGNING_KEY_PATH:}
  token:
    audience: ${AUTH_TOKEN_AUDIENCE:resource-server}
    access-ttl: ${AUTH_ACCESS_TOKEN_TTL:15m}
    refresh-ttl: ${AUTH_REFRESH_TOKEN_TTL:12h}
  security:
    # HSTS only makes sense behind TLS; enable in prod/docker deployments.
    hsts-enabled: ${AUTH_HSTS_ENABLED:false}
  client-registration:
    # Set to a strong random value to enable POST /api/v1/clients; unset = disabled.
    token: ${AUTH_CLIENT_REGISTRATION_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    org.springframework.security: INFO
    com.zhouij.authplatform.authserver: INFO
