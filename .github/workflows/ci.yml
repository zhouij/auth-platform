name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build all modules and run tests
        run: ./gradlew build --no-daemon

  smoke-test:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build boot jars
        run: ./gradlew bootJar --no-daemon

      - name: Start Postgres
        run: |
          docker compose up -d postgres
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U postgres && break
            sleep 2
          done

      - name: Start services
        run: |
          java -jar iam-server/build/libs/iam-server-1.0.0-SNAPSHOT.jar > iam.log 2>&1 &
          java -jar auth-server/build/libs/auth-server-1.0.0-SNAPSHOT.jar > auth.log 2>&1 &
          java -jar resource-server/build/libs/resource-server-1.0.0-SNAPSHOT.jar > resource.log 2>&1 &
          java -jar gateway/build/libs/gateway-1.0.0-SNAPSHOT.jar > gateway.log 2>&1 &
          java -jar web-client/build/libs/web-client-1.0.0-SNAPSHOT.jar > web-client.log 2>&1 &
          for url in \
              http://localhost:9083/actuator/health \
              http://localhost:9081/actuator/health \
              http://localhost:9082/actuator/health \
              http://localhost:9080/actuator/health \
              http://localhost:9084/actuator/health; do
            for i in $(seq 1 60); do
              curl -fsS "$url" > /dev/null 2>&1 && break
              sleep 2
            done
          done

      - name: Run smoke test
        run: ./smoke-test.sh

      - name: Run BFF smoke test
        run: ./smoke-bff.sh

      - name: Show service logs on failure
        if: failure()
        run: |
          for f in iam.log auth.log resource.log gateway.log web-client.log; do
            echo "===== $f ====="; tail -100 "$f"
          done

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build all service images
        run: docker compose build
