<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auth Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #111; }
        header { background: white; border-bottom: 1px solid #ddd; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
        main { max-width: 960px; margin: 2rem auto; padding: 0 1rem; display: grid; gap: 1rem; }
        h1 { font-size: 1.25rem; }
        h2 { font-size: 1rem; margin-bottom: 0.75rem; }
        .card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 1rem; }
        dl { display: grid; grid-template-columns: 8rem 1fr; gap: 0.5rem; }
        dt { font-weight: 600; color: #555; }
        dd { overflow-wrap: anywhere; }
        pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f7f7f7; border: 1px solid #ddd; border-radius: 6px; padding: 0.75rem; }
        button { padding: 0.5rem 0.75rem; border: 1px solid #bbb; background: white; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>Auth Platform</h1>
        <form method="post" action="/logout">
            <button type="submit">Sign out</button>
        </form>
    </header>
    <main>
        <section class="card">
            <h2>Signed in user</h2>
            <dl>
                <dt>Name</dt>
                <dd th:text="${name}"></dd>
                <dt>Email</dt>
                <dd th:text="${email}"></dd>
                <dt>Subject</dt>
                <dd th:text="${subject}"></dd>
            </dl>
        </section>
        <section class="card">
            <h2>IAM status through gateway</h2>
            <pre th:text="${iamStatus}"></pre>
        </section>
        <section class="card">
            <h2>Resource status through gateway</h2>
            <pre th:text="${resourceStatus}"></pre>
        </section>
    </main>
</body>
</html>
